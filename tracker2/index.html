<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="theme-color" content="#0c0d0f">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0d0f;--s1:#16171a;--s2:#1f2024;--bd:#2a2c31;--tx:#f4f5f2;--mu:#8e9097;--ac:#c8f31d;--or:#ff5b2e;--bl:#3d8bff;--on:#0c0d0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:24px 20px 56px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sub{color:var(--mu);font-size:13px;margin:0}
.bar{display:block;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c,var(--ac));border-radius:3px;transition:width .2s}
.cal{margin:18px 0 22px;padding:16px 10px 18px;border-radius:16px;background:var(--s1);border:1px solid var(--bd)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dy{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;cursor:pointer}
.dy span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font:700 18px Archivo,sans-serif;color:var(--tx)}
.dy.full span{box-shadow:inset 0 0 0 2px var(--c)}.dy.on span{background:var(--c);color:var(--on)}
.pt{margin:18px 6px 0;font-size:14px;font-weight:600}.cal .bar{margin:8px 6px 0}
.ex{margin-bottom:10px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);overflow:hidden}.ex.done{border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.eh{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}.eh.static{cursor:default}
.no{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--s2);font-size:18px;font-weight:700;flex:none}
.done .no{background:var(--ac);color:var(--on)}.no .i{width:18px;height:18px;stroke-width:3}
.en{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.rs{flex:none;text-align:right}.rs b{display:block;font-size:20px;line-height:1;font-weight:700;color:var(--ac);white-space:nowrap}.rs span{font-size:11px;color:var(--mu)}
.chev{color:var(--mu);transition:transform .15s}.open .chev{transform:rotate(90deg)}
.eb{padding:0 14px 16px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.meta div{min-width:0;padding:10px 12px;border-radius:10px;background:var(--s2)}.meta .w{grid-column:1/-1}
.meta dt{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu)}.meta dt .i{width:14px;height:14px;color:var(--ac)}.meta dd{margin:3px 0 0;font-size:14px;font-weight:500}
.notes{margin:0 0 14px;color:#c9cbd0;font-size:14px}
.sets{display:grid;gap:8px;margin-bottom:6px}.more{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;font-weight:500;cursor:pointer}.more .i{width:14px;height:14px;transition:transform .15s}.more[aria-expanded=true] .i{transform:rotate(90deg)}.more:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:58px;padding:0 16px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;user-select:none}
.set b{font-weight:500;font-size:14px}.set.on{background:rgba(200,243,29,.1);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}.set.on b{color:var(--mu)}
.set input{appearance:none;-webkit-appearance:none;width:32px;height:32px;margin:0;flex:none;border:2px solid #474a52;border-radius:50%;display:grid;place-content:center;cursor:pointer}
.set input:checked{background:var(--ac);border-color:var(--ac)}
.set input:checked::after{content:"";width:7px;height:14px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tut{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;color:var(--ac);text-decoration:none;font-size:13px;font-weight:500}.tut .i{width:13px;height:13px;fill:currentColor}
.set input:focus-visible,.dy:focus-visible,.card:focus-visible,.eh:focus-visible,.pill:focus-visible,.btn:focus-visible,.tut:focus-visible,.back:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.opt{margin-top:32px;padding:0 18px;border:1px solid var(--bd);border-radius:14px;background:var(--s1)}
.opt summary{display:flex;align-items:center;min-height:56px;font-weight:600;cursor:pointer;list-style:none}.opt summary::-webkit-details-marker{display:none}
.opt .in{padding-bottom:16px}.opt .sub{margin:14px 0 8px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;margin:0 8px 8px 0;border:1px solid var(--bd);border-radius:10px;background:var(--s2);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}.btn .i{width:16px;height:16px}
.btn.dng{color:#ff9a8a;border-color:#5a3330}
select{display:block;width:100%;min-height:44px;margin-bottom:8px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--s2);color:var(--tx);font:inherit;font-size:14px}
.note{margin:12px 0 0;color:var(--ac);font-size:13px}

.bar0{display:flex;align-items:center;min-height:44px;margin:-8px 0 8px}.brand{font-weight:700;font-size:14px;color:var(--mu)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-left:-4px;color:var(--mu);text-decoration:none;font-size:14px;font-weight:500}.back .i{width:18px;height:18px}
h1.ttl{font-size:26px;line-height:1.15;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2.sec{font-size:18px;font-weight:700;margin:28px 0 4px}h2.sec+.sub{margin:0 0 14px}
.sum{margin:20px 0 24px}.sum .pt{margin:0 0 8px}
.list{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:48px 1fr auto;column-gap:14px;align-items:center;width:100%;min-height:72px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);color:inherit;font:inherit;text-align:left;cursor:pointer}
.dayrow.rest{background:none;cursor:default;color:var(--mu)}
.dno{display:grid;place-items:center;grid-row:1/3;width:48px;height:48px;border-radius:50%;background:var(--c);color:var(--on);font-weight:800;font-size:20px}.rest .dno{background:var(--s2);color:var(--mu)}
.dayrow.rest .dno{grid-row:auto}
.dtx{min-width:0}.dtx b{display:block;font-weight:700;font-size:16px;line-height:1.25}.dtx span{font-size:12px;color:var(--mu)}
.dst{font-size:13px;font-weight:600}.dayrow.done .dst{color:var(--c)}
.dayrow .bar{grid-column:2/4;margin-top:8px}.dayrow .bar i{background:var(--c)}
.rs{min-width:84px}
.dayrow:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.sr .pt{margin:0}
.btn.sm{min-height:36px;padding:0 12px;margin:0;font-size:13px}
.cal2{margin-top:28px;padding:16px;border:1px solid var(--bd);border-radius:14px;background:var(--s1)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ch h2.sec{margin:0}
.cb{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--s2);color:var(--tx);cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}.cg small{font-size:11px;color:var(--mu);padding-bottom:4px}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px;padding-top:4px}
.cd b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:600}.cd.td b{background:var(--ac);color:var(--on)}
.cd em{display:flex;gap:3px;min-height:8px}.cd i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c)}.cd i.f{background:var(--c)}
.cal2 .sub{margin-top:10px}.cb:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.bar0{justify-content:space-between}
.lo{min-height:44px;padding:0;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;cursor:pointer}
.lg{padding-top:10vh}.fl{display:block;margin-top:18px;font-size:13px;color:var(--mu)}
.fl input{display:block;width:100%;min-height:48px;margin-top:6px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);color:var(--tx);font:inherit;font-size:16px}
.fl input:focus-visible,.lo:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn.pri{width:100%;justify-content:center;min-height:48px;margin:22px 0 0;background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.err{margin:14px 0 0;color:#ff9a8a;font-size:13px}

/* gradient treatment: soft colour fields and a faint grid over the dark base, tinted by the day colour */
:root{--g1:#ff7a45;--g2:#4da3ff;--g3:#b277ff;--g4:#2fd6a0}
body{background:none;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 38% at 8% -4%,color-mix(in srgb,var(--g1) 38%,transparent),transparent 72%),radial-gradient(60% 40% at 104% 18%,color-mix(in srgb,var(--g2) 30%,transparent),transparent 72%),radial-gradient(75% 42% at -6% 104%,color-mix(in srgb,var(--g3) 26%,transparent),transparent 72%),radial-gradient(65% 40% at 104% 106%,color-mix(in srgb,var(--g4) 24%,transparent),transparent 72%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%);mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.dayrow{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,var(--s1)),var(--s1) 62%);border-color:color-mix(in srgb,var(--c) 30%,var(--bd))}
.dayrow.rest{background:none;border-color:var(--bd)}
.dno{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000))}
.cal{background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 26%,var(--s1)),var(--s1) 70%);border-color:color-mix(in srgb,var(--ac) 28%,var(--bd))}
.cal2,.opt{background:linear-gradient(150deg,color-mix(in srgb,var(--g1) 14%,var(--s1)),var(--s1) 55%,color-mix(in srgb,var(--g4) 10%,var(--s1)))}
.ex{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 11%,var(--s1)),var(--s1) 55%);border-color:color-mix(in srgb,var(--ac) 18%,var(--bd))}
.ex.done{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 24%,var(--s1)),var(--s1) 80%);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.dy.on span{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c))}
.bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--ac)) 55%,#000),var(--c,var(--ac)))}
.dayrow .bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),var(--c))}
.sum .bar i{background:linear-gradient(90deg,#ff7a45,#ffc83d,#2fd6a0,#4da3ff,#b277ff)}
.set.on{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 24%,transparent),color-mix(in srgb,var(--ac) 8%,transparent))}
.set input:checked,.done .no,.cd.td b{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 65%,#fff),var(--ac))}
.btn.pri{background:linear-gradient(135deg,#b7e5ba,#5ca87c);border-color:#5ca87c}
</style></head><body>

<script>
const CSV={w14:"﻿Block,Day,Workout,Exercise,Target Muscle,Sets,Reps,Reps to Failure,Rest,Form Notes,Video Tutorial\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Back Squat,\"Quads, Glutes\",3,6,3 reps from failure,3-4 min,\"Sit back and down, 15° toe flare, drive your knees out laterally.\",https://www.youtube.com/watch?v=bEv6CCg2BC8\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Romanian Deadlift,\"Hamstrings, Glutes\",3,10,3 reps from failure,2-3 min,\"Maintain a neutral lower back, set your hips back, don't allow your spine to round.\",https://www.youtube.com/watch?v=_oyxCn2iSjU\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Barbell Hip Thrust,Glutes,3,12,2 reps from failure,2-3 min,\"Tuck your chin and rib cage down, only move your hips. Use a pad on the bar across your bench.\",https://www.youtube.com/watch?v=xDmFkJxPzeM\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Leg Extension,Quads,3,12,1 rep from failure,1-2 min,Focus on squeezing your quads to make the weight move.,https://www.youtube.com/watch?v=ljO4jkwv8wQ\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Lying Leg Curl (or Seated),Hamstrings,3,12,1 rep from failure,1-2 min,Focus on squeezing your hamstrings to make the weight move.,https://www.youtube.com/watch?v=Lh3iMIcbkBQ\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Side-Lying Dumbbell Hip Abduction,Upper Glutes,3,12/side,3 reps from failure,1-2 min,\"Lie on your side on the floor/bench, hold a dumbbell on your outer thigh, and raise your top leg with a straight knee.\",https://www.youtube.com/watch?v=-rDiQXjeXO0\nWeeks 1-4 (Modified Strength Base),Day 1,Lower Body #1,Crunch,Abs,3,12,3 reps from failure,1-2 min,\"Focus on flexing your spine, don't yank your head with your arms.\",https://www.youtube.com/watch?v=1G0y8D5rFDc\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Barbell Bench Press,\"Chest, Triceps\",3,5,3 reps from failure,3-4 min,\"Tuck elbows at a 45° angle, squeeze your shoulder blades and stay firm on the bench.\",https://www.youtube.com/watch?v=vcBig73ojpE\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Lat Pulldown,Lats,3,10,2 reps from failure,2-3 min,\"Pull your elbows straight out to your sides, use a 1.5x shoulder width grip.\",https://www.youtube.com/watch?v=hnSqbBk15tw\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Military Press,Front Delts,3,10,3 reps from failure,3-4 min,\"Squeeze your glutes to keep your torso upright, clear your head out of the way, press up and slightly back.\",https://www.youtube.com/watch?v=_RlRDWO2jfg\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Chest-Supported Dumbbell Row,\"Mid-Back, Mid/Lower Traps\",3,12,2 reps from failure,2-3 min,Lie chest-down on a 30-45° incline bench (or brace one hand on a flat bench); retract shoulder blades at the top.,https://www.youtube.com/watch?v=2ByilQ4NaAs\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Dumbbell Flye,Chest,3,12,2 reps from failure,1-2 min,\"Keep shoulder blades retracted and elbows slightly bent; lower until upper arms are level with the bench, then squeeze together.\",https://www.youtube.com/watch?v=QENKPHhQVi4\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Barbell Shrug,Upper Traps,3,10-12,2 reps from failure,1-2 min,\"Stand tall with a slight forward torso lean, pull shoulders straight up toward your ears without rolling them, pause 1 sec at the top.\",https://www.youtube.com/watch?v=C6sYjDFuq9I\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Dumbbell Supinated Curl,Biceps,3,10,2 reps from failure,1-2 min,Drive your pinky into the handle harder than your pointer finger.,https://www.youtube.com/watch?v=i1YgFZB6alI\nWeeks 1-4 (Modified Strength Base),Day 2,Upper Body #1,Single-Arm Dumbbell Overhead Extension,Triceps,3,12,2 reps from failure,1-2 min,\"Sit upright on the bench, keep your upper arm locked near your ear, and lower the dumbbell behind your head for a full stretch.\",https://www.youtube. const IC={dumb:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>',pulse:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',back:'<path d="M15 5l-7 7 7 7"/>',next:'<path d="M9 5l7 7-7 7"/>',play:'<path d="M8 5.5v13l11-6.5z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',rep:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2 0-3-1-5 1-8z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',sets:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
function optsHtml(m){const pr=m.p.rows.length,hid=pr-m.placed;
 return `<details class="opt"${optOpen?' open':''}><summary>Programme options</summary><div class="in">${note?`<p class="note">${esc(note)}</p>`:''}
<p class="sub">Programme</p><select id="prog" aria-label="Programme">${m.P.map(x=>`<option value="${x.id}"${x.id==m.p.id?' selected':''}>${esc(x.name)}${x.id=='custom'?' ('+esc(x.file)+')':''}</option>`).join('')}</select>
<p class="sub">${pr} exercises in this CSV.${hid>0?` ${hid} rows don’t match a scheduled workout and aren’t shown.`:''}</p>
<label class="btn">${ic('up')}Upload programme CSV<input id="upp" type="file" accept=".csv,text/csv" hidden></label>${S.custom?'<button class="btn" data-act="rmprog">Remove uploaded programme</button>':''}
<p class="sub">Run / Core: ${esc(S.core?S.core.name:'built-in core workout')}, ${m.core.length} exercises, added to both run days.</p>
<label class="btn">${ic('up')}Upload core CSV<input id="upc" type="file" accept=".csv,text/csv" hidden></label>${S.core?'<button class="btn" data-act="rmcore">Use built-in core workout</button>':''}</div></details>`}
const DC=['#ff7a45','#4da3ff','#2fd6a0','#ff4d7e','#b277ff','#ffc83d','#6b7280'];
function row(d){const c=DC[d.n-1];
 if(d.rest)return `<div class="dayrow rest" style="--c:${c}"><span class="dno">${d.n}</span><span class="dtx"><b>Rest Day</b></span></div>`;
 return `<button class="dayrow${d.total&&d.done==d.total?' done':''}" style="--c:${c}" data-day="${d.n}"><span class="dno">${d.n}</span><span class="dtx"><b>${esc(d.w)}</b><span>${d.run?esc(d.run)+', ':''}${d.count?d.count+(d.count==1?' exercise':' exercises'):'No exercises in CSV'}${d.runOn?', run done':''}</span></span><span class="dst">${d.done}/${d.total} sets</span><span class="bar"><i style="width:${pc(d.done,d.total)}%"></i></span></button>`}
function logDay(k){const n=k.startsWith('run')?+k.slice(3):+k.split('.')[0],dd=model().days.find(x=>x.n==n);if(!dd)return;
 const st=(dd.done||dd.runOn)?((dd.done==dd.total&&(!dd.run||dd.runOn))?2:1):0,key=ymd(new Date()),L=S.log=S.log||{},e=L[key]=L[key]||{};
 if(st)e[n]=st;else delete e[n];if(!Object.keys(e).length)delete L[key]}
function calHtml(){const y=calY,mo=calM,first=new Date(y,mo,1),lead=(first.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),log=S.log||{},td=ymd(new Date());let cells='';
 for(let i=0;i<lead;i++)cells+='<span></span>';
 for(let d=1;d<=dim;d++){const k=ymd(new Date(y,mo,d)),e=log[k]||{},dots=Object.keys(e).sort().map(n=>`<i class="${e[n]==2?'f':''}" style="--c:${DC[n-1]}"></i>`).join('');
  cells+=`<span class="cd${k==td?' td':''}"><b>${d}</b><em>${dots}</em></span>`}
 return `<section class="cal2"><div class="ch"><button class="cb" data-act="calprev" aria-label="Previous month">${ic('back')}</button><h2 class="sec">${first.toLocaleString('en',{month:'long'})} ${y}</h2><button class="cb" data-act="calnext" aria-label="Next month">${ic('next')}</button></div><div class="cg">${['M','T','W','T','F','S','S'].map(x=>`<small>${x}</small>`).join('')}${cells}</div><p class="sub">Each dot is a workout you trained that day, in its day colour. Filled means completed, outlined means started.</p></section>`}
function dash(m){const pct=pc(m.done,m.total);
 const sum=ask?`<div class="sum"><p class="pt" style="margin-bottom:12px">Reset all progress for this programme? Calendar marks stay.</p><button class="btn dng" data-act="reset">Reset progress</button><button class="btn" data-act="cancel">Cancel</button></div>`:`<div class="sum"><div class="sr"><p class="pt">${m.done}/${m.total} sets completed (${pct}%)</p><button class="btn sm" data-act="ask">${ic('reset')}Reset</button></div><span class="bar"><i style="width:${pct}%"></i></span></div>`;
 return `<div class="bar0"><span class="brand">Gym Tracker</span><button class="lo" data-act="logout">Log out (${esc(USER)})</button></div><h1 class="ttl">Weekly training</h1><p class="sub">${esc(m.p.name)}</p>${sum}
<div class="list">${m.days.map(row).join('')}</div>${calHtml()}${optsHtml(m)}`}
function exCard(e,num){const f=e.r,n=e.sets,c=e.done,full=c==n,open=OPEN.has(e.key),rp=/^[\d-]+$/.test(f.Reps)?f.Reps+' reps':f.Reps,u=f['Video Tutorial'];
 const fld=(l,v,i,w)=>`<div${w?' class="w"':''}><dt>${ic(i)}${l}</dt><dd>${esc(v)||'—'}</dd></div>`;let sets='';
 for(let i=0;i<n;i++){const on=!!e.arr[i];sets+=`<label class="set${on?' on':''}"><b>Set ${i+1}${rp?' — '+esc(rp):''}</b><input type="checkbox" data-k="${esc(e.key)}" data-i="${i}"${on?' checked':''}></label>`}
 const o2=OPEN2.has(e.key),link=/^https?:\/\//i.test(u)?`<a class="tut" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('play')}Watch Tutorial ↗</a>`:'<span class="sub">No tutorial listed</span>';
 const body=open?`<div class="eb">${f['Form Notes']?`<p class="notes">${esc(f['Form Notes'])}</p>`:''}<div class="sets">${sets}</div><button class="more" data-more="${esc(e.key)}" aria-expanded="${o2}">${o2?'Hide details':'More details'}${ic('next')}</button>${o2?`<dl class="meta">${fld('Target muscle',f['Target Muscle'],'target',1)}${fld('Reps to failure',f['Reps to Failure'],'flame')}${fld('Rest',f.Rest,'clock')}</dl>${link}`:''}</div>`:'';
 return `<article class="ex${full?' done':''}${open?' open':''}"><button class="eh" data-ex="${esc(e.key)}" aria-expanded="${open}"><span class="no">${full?ic('check'):num}</span><span class="en">${esc(f.Exercise)||'Untitled exercise'}</span><span class="rs"><b>${esc(f.Sets)||n} × ${esc(f.Reps)||'—'}</b><span>${c}/${n} completed</span></span><span class="chev">${ic('next')}</span></button>${body}</article>`}
function wk(m){const d=m.days.find(x=>x.n==S.day)||m.days[0],r0=d.groups&&d.groups[0]&&d.groups[0].rows[0];
 const strip=m.days.map(x=>`<button class="dy${x.n==d.n?' on':''}${x.total&&x.done==x.total?' full':''}" style="--c:${DC[x.n-1]}" data-day="${x.n}" aria-label="Day ${x.n}">Day<span>${x.n}</span></button>`).join('');
 const sub=d.rest||d.run?'Day '+d.n:r0?esc(r0.Block)+', listed as '+esc(r0.Day)+' in the CSV':'No exercises for this workout in the CSV';
 let h=`<div style="--ac:${DC[d.n-1]}"><div class="bar0"><a class="back" href="#dashboard">${ic('back')}Dashboard</a></div><h1 class="ttl">${esc(d.w)}</h1><p class="sub">${sub}</p>
<div class="cal"><div class="strip">${strip}</div>${d.rest?'':`<p class="pt">${d.done}/${d.total} sets completed (${pc(d.done,d.total)}%)</p><span class="bar"><i style="width:${pc(d.done,d.total)}%"></i></span>`}</div>`;
 if(d.rest)return h+'<p class="sub">No training scheduled.</p></div>';
 if(d.run)h+=`<article class="ex${d.runOn?' done':''}"><div class="eh static"><span class="no">${d.runOn?ic('check'):ic('pulse')}</span><span class="en">${esc(d.run)}</span></div><div class="eb"><div class="sets" style="margin:0"><label class="set${d.runOn?' on':''}"><b>Run completed</b><input type="checkbox" data-k="run${d.n}" data-i="0"${d.runOn?' checked':''}></label></div></div></article>`;
 d.groups.forEach(g=>{if(d.run){const r=g.rows[0];h+=`<h2 class="sec">${esc(g.title)}</h2><p class="sub">${esc(r.Block)}, ${esc(r.Day)}</p>`}h+=g.ex.map((e,i)=>exCard(e,i+1)).join('')});
 return h+'</div>'}
function loginHtml(){return `<div class="lg"><span class="brand">Gym Tracker</span><h1 class="ttl" style="margin-top:12px">Log in</h1><p class="sub">Use the username and password you were given.</p>
<label class="fl">Username<input id="lu" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(loginU)}"></label>
<label class="fl">Password<input id="lp" type="password" autocomplete="current-password"></label>
${loginErr?`<p class="err">${esc(loginErr)}</p>`:''}<button class="btn pri" data-act="login">Log in</button></div>`}

function render(){if(!USER){setGlow(['#5ca87c','#288760','#b7e5ba','#1a5140']);$('#app').innerHTML=loginHtml();return}const m=model(),y=scrollY,dc=DC[(+S.day||1)-1];setGlow(location.hash=='#workout'?[dc,dc,dc,dc]:[DC[0],DC[1],DC[4],DC[2]]);$('#app').innerHTML=location.hash=='#workout'?wk(m):dash(m);scrollTo(0,y)}
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('opt'))optOpen=e.target.open},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-day],[data-act],[data-ex],[data-more]');if(!b)return;

 const a=b.dataset.act;
 if(a=='ask')ask=true;else if(a=='cancel')ask=false;else if(a=='calprev'){if(--calM<0){calM=11;calY--}}else if(a=='calnext'){if(++calM>11){calM=0;calY++}}
 else if(a=='login'){loginU=$('#lu').value.trim();const p=$('#lp').value,u=loginU.toLowerCase();if(u&&USERS[u]!==undefined&&USERS[u]===p){enter(u);loginErr='';loginU='';note='';ask=false}else loginErr='Wrong username or password.'}
 else if(a=='logout'){save();USER=null;try{localStorage.removeItem(SESS)}catch(e){}ckSet('gt_session','',0);note='';ask=false}

document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.k){const p=model().p.id,d=S.done[p]=S.done[p]||{},a=d[t.dataset.k]=d[t.dataset.k]||[];a[+t.dataset.i]=t.checked;logDay(t.dataset.k);save();render()}

 else if(t.id=='upp'||t.id=='upc'){const f=t.files[0];if(!f)return;let ok=false,rows=[],txt='';
