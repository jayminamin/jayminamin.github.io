<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link id="pwa-manifest" rel="manifest">
<link id="pwa-icon" rel="apple-touch-icon">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --g1{syntax:"<color>";inherits:true;initial-value:#ff7a45}
@property --g2{syntax:"<color>";inherits:true;initial-value:#4da3ff}
@property --g3{syntax:"<color>";inherits:true;initial-value:#b277ff}
@property --g4{syntax:"<color>";inherits:true;initial-value:#2fd6a0}
@property --ac{syntax:"<color>";inherits:true;initial-value:#ff7a45}

:root{color-scheme:dark;--bg:#0c0d0f;--s1:#16171a;--s2:#1f2024;--bd:#2a2c31;--tx:#f4f5f2;--mu:#8e9097;--ac:#ff7a45;--or:#ff5b2e;--bl:#3d8bff;--on:#0c0d0f;--bar-bg:rgba(255,255,255,.1);--grid-line:rgba(255,255,255,.045);--note-tx:#c9cbd0;--detail-tx:#d6d8dd;--chk-bd:#474a52;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:--ac .4s var(--ease),--g1 .5s var(--ease),--g2 .5s var(--ease),--g3 .5s var(--ease),--g4 .5s var(--ease)}
html.light{color-scheme:light;--bg:#f5f6f8;--s1:#ffffff;--s2:#eceef2;--bd:#dcdfe6;--tx:#14161a;--mu:#636773;--ac:#e0531f;--on:#ffffff;--bar-bg:rgba(0,0,0,.09);--grid-line:rgba(0,0,0,.04);--note-tx:#3b3f4a;--detail-tx:#2b2f38;--chk-bd:#9ea4b0}
html.theme-xf,html.theme-xf body,html.theme-xf .cal,html.theme-xf .cal2,html.theme-xf .opt,html.theme-xf .ex,html.theme-xf .dayrow,html.theme-xf .stat-box,html.theme-xf .set,html.theme-xf .btn,html.theme-xf .icon-btn,html.theme-xf .num-in,html.theme-xf .opt-grp{transition:background-color .28s var(--ease),border-color .28s var(--ease),color .28s var(--ease)!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:520px;margin:0 auto;padding:24px 20px 104px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sub{color:var(--mu);font-size:13px;margin:0}
.bar{display:block;height:5px;background:var(--bar-bg);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c,var(--ac));border-radius:3px;transition:width .38s var(--ease)}
.cal{margin:18px 0 22px;padding:16px 10px 18px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);transition:border-color .3s var(--ease)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dy{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;cursor:pointer;transition:color .2s var(--ease),transform .15s var(--ease)}
.dy span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font:700 18px Archivo,sans-serif;color:var(--tx);transition:transform .2s var(--spring),background-color .25s var(--ease),box-shadow .25s var(--ease),color .2s var(--ease)}
.dy.full span{box-shadow:inset 0 0 0 2px var(--c)}.dy.on span{background:var(--c);color:var(--on);transform:scale(1.04)}
.dy:active span{transform:scale(.91)}
.pt{margin:18px 6px 0;font-size:14px;font-weight:600}.cal .bar{margin:8px 6px 0}
.ex{margin-bottom:10px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);overflow:hidden;transition:border-color .22s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease)}.ex.done{border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.eh{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background-color .18s var(--ease)}.eh.static{cursor:default}
.eh:not(.static):active{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.no{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--s2);font-size:18px;font-weight:700;flex:none;transition:background-color .25s var(--ease),color .25s var(--ease),transform .25s var(--spring)}
.done .no{background:var(--ac);color:var(--on)}.no .i{width:18px;height:18px;stroke-width:3}
.en{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.pr-badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:6px;background:rgba(255,200,61,.18);color:#ffc83d;font-size:10px;font-weight:800;letter-spacing:.04em;vertical-align:middle}
html.light .pr-badge{background:rgba(217,140,0,.16);color:#9a6200}
.rs{flex:none;text-align:right;min-width:84px}.rs b{display:block;font-size:20px;line-height:1;font-weight:700;color:var(--ac);white-space:nowrap;transition:color .3s var(--ease)}.rs span{font-size:11px;color:var(--mu)}
.chev{color:var(--mu);transition:transform .24s var(--ease)}.open .chev{transform:rotate(90deg)}
.eb{padding:0 14px 16px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.meta div{min-width:0;padding:10px 12px;border-radius:10px;background:var(--s2)}.meta .w{grid-column:1/-1}
.meta dt{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu)}.meta dt .i{width:14px;height:14px;color:var(--ac)}.meta dd{margin:3px 0 0;font-size:14px;font-weight:500}
.notes{margin:0 0 14px;color:var(--note-tx);font-size:14px}
.sets{display:grid;gap:8px;margin-bottom:6px}
.more{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:color .18s var(--ease)}.more .i{width:14px;height:14px;transition:transform .22s var(--ease)}.more[aria-expanded=true] .i{transform:rotate(90deg)}.more:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.set{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:58px;padding:8px 12px 8px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);user-select:none;transition:background-color .22s var(--ease),border-color .22s var(--ease)}
.set-lbl{flex:1;min-width:0;cursor:pointer}
.set b{display:block;font-weight:600;font-size:14px;color:var(--tx)}
.set small{display:block;font-size:11px;color:var(--tx);opacity:.82}
.set.on{background:rgba(200,243,29,.12);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
html.light .set.on{background:rgba(92,138,0,.1)}
.set.on b{color:var(--tx)}
.set.on small{color:var(--tx);opacity:.82}
.set-in{display:flex;align-items:center;gap:6px}
.copy-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:36px;padding:0;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--ac);cursor:pointer;flex:none;transition:background-color .16s var(--ease),border-color .16s var(--ease),transform .14s var(--ease)}
.copy-btn:active{transform:scale(.92)}
.copy-btn .i{width:14px;height:14px}
.num-in{width:54px;height:36px;padding:0 6px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font:600 13px Archivo,sans-serif;text-align:center;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background-color .18s var(--ease)}
.num-in::placeholder{color:var(--mu);font-weight:400}
.num-in:focus{outline:2px solid var(--ac);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent)}
.set input[type=checkbox]{appearance:none;-webkit-appearance:none;width:32px;height:32px;margin:0;flex:none;border:2px solid var(--chk-bd);border-radius:50%;display:grid;place-content:center;cursor:pointer;transition:border-color .18s var(--ease),background-color .18s var(--ease),transform .18s var(--spring),box-shadow .18s var(--ease)}
.set input[type=checkbox]:active{transform:scale(.9)}
.set input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.set input[type=checkbox]:checked::after{content:"";width:7px;height:14px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tut-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tut{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;color:var(--ac);text-decoration:none;font-size:13px;font-weight:500;background:none;font-family:inherit;cursor:pointer;transition:border-color .18s var(--ease),background-color .18s var(--ease),transform .14s var(--ease)}.tut:active{transform:scale(.96)}.tut .i{width:13px;height:13px;fill:currentColor}
.set input:focus-visible,.dy:focus-visible,.card:focus-visible,.eh:focus-visible,.pill:focus-visible,.btn:focus-visible,.tut:focus-visible,.back:focus-visible,summary:focus-visible,.copy-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
html,body{max-width:100%;overflow-x:hidden}
.opt{display:block;width:100%;max-width:100%;margin-top:24px;border:1px solid var(--bd);border-radius:16px;background:var(--s1);transition:border-color .22s var(--ease)}
.opt summary{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;list-style:none;transition:color .18s var(--ease)}.opt summary::-webkit-details-marker{display:none}
.opt summary .chev{color:var(--mu);transition:transform .24s var(--ease)}
.opt[open] summary .chev{transform:rotate(90deg)}
.opt[open] .in{animation:unfold .24s var(--ease) both}
.opt .in{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:4px 18px 20px}
.opt-grp{min-width:0;max-width:100%;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--s2) 65%,var(--bg));border:1px solid var(--bd)}
.opt-lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
.opt-desc{margin:8px 0 0;font-size:12.5px;color:var(--mu);line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;margin:0;border:1px solid var(--bd);border-radius:10px;background:var(--s2);color:var(--tx);font:600 13px Archivo,sans-serif;cursor:pointer;text-align:center;transition:border-color .18s var(--ease),background-color .18s var(--ease),transform .14s var(--ease),box-shadow .18s var(--ease)}.btn:active{transform:scale(.97)}.btn .i{width:15px;height:15px;color:var(--ac)}
.btn.dng{color:#ff9a8a;border-color:#5a3330}.btn.dng .i{color:currentColor}
html.light .btn.dng{color:#c93b2b;border-color:#e5b3ad}
html.light .opt-grp,
html.light .btn,
html.light .meta div,
html.light .num-in,
html.light .day-detail,
html.light .cb,
html.light .modal-x,
html.light .seg,
html.light .presets button,
html.light .custom-time input,
html.light .timer-pill button:not(.pri-sm):not(.x){background:#ffffff;border:1px solid var(--bd)}
html.light .unit-seg,
html.light .prog-seg{background:#ffffff;border:1px solid var(--bd)}
html.light .unit-seg button.on,
html.light .prog-seg button.on{background:color-mix(in srgb,var(--ac) 12%,#ffffff);border:1px solid color-mix(in srgb,var(--ac) 55%,var(--bd));box-shadow:none}
html.light .set{background:#ffffff}
html.light .run-grid input{background:#ffffff}

.opt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt-actions .btn.full{grid-column:1/-1}
.unit-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.unit-seg button{height:36px;border:0;border-radius:7px;background:none;color:var(--mu);font:600 13px Archivo,sans-serif;cursor:pointer;transition:color .16s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease),transform .14s var(--ease)}
.unit-seg button:active{transform:scale(.97)}
.unit-seg button.on{background:var(--s2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--ac) 40%,var(--bd))}
.prog-seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;padding:4px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.prog-seg button{min-height:40px;padding:8px 10px;border:1px solid transparent;border-radius:7px;background:none;color:var(--mu);font:600 13px Archivo,sans-serif;line-height:1.25;cursor:pointer;transition:color .16s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease),transform .14s var(--ease);word-break:break-word}
.prog-seg button:active{transform:scale(.97)}
.prog-seg button.on{background:var(--s2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25);border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.note{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--ac) 12%,var(--s2));border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);color:var(--tx);font-size:13px;font-weight:500}

.bar0{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:-8px 0 8px}.brand{font-weight:700;font-size:14px;color:var(--mu)}
.bar0-r{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),background-color .18s var(--ease),transform .14s var(--ease)}
.icon-btn:active{transform:scale(.91)}
.icon-btn.active{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--s1))}
.icon-btn .i{width:17px;height:17px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-left:-4px;color:var(--mu);text-decoration:none;font-size:14px;font-weight:500;transition:color .18s var(--ease),transform .18s var(--ease)}.back .i{width:18px;height:18px;transition:transform .18s var(--ease)}.back:active{transform:scale(.96)}
h1.ttl{font-size:26px;line-height:1.15;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2.sec{font-size:18px;font-weight:700;margin:28px 0 4px}h2.sec+.sub{margin:0 0 14px}
.sum{margin:20px 0 16px}.sum .pt{margin:0 0 8px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 20px}
.stat-box{padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);transition:border-color .2s var(--ease),transform .2s var(--ease)}
.stat-box span{display:block;font-size:11px;color:var(--mu)}
.stat-box b{display:block;font-size:17px;font-weight:800;margin-top:2px;color:var(--tx)}
.list{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:48px 1fr auto;column-gap:14px;align-items:center;width:100%;min-height:72px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
.dayrow:not(.rest):active{transform:scale(.985)}
.dayrow.rest{background:var(--s1);cursor:default;color:var(--mu)}
.dno{display:grid;place-items:center;grid-row:1/3;width:48px;height:48px;border-radius:50%;background:var(--c);color:#0c0d0f;font-weight:800;font-size:20px;transition:transform .22s var(--spring)}.rest .dno{background:var(--s2);color:var(--mu)}
.dayrow.rest .dno{grid-row:auto}
.dtx{min-width:0}.dtx b{display:block;font-weight:700;font-size:16px;line-height:1.25}.dtx span{font-size:12px;color:var(--mu)}
.dst{font-size:13px;font-weight:600;transition:color .2s var(--ease)}.dayrow.done .dst{color:var(--c)}
html.light .dayrow.done .dst{color:color-mix(in srgb,var(--c) 75%,#000)}
.dayrow .bar{grid-column:2/4;margin-top:8px}.dayrow .bar i{background:var(--c)}
.dayrow:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.sr .pt{margin:0}
.btn.sm{min-height:36px;padding:0 12px;margin:0;font-size:13px}
.cal2{margin-top:24px;padding:16px;border:1px solid var(--bd);border-radius:14px;background:var(--s1)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ch h2.sec{margin:0}
.cb{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--s2);color:var(--tx);cursor:pointer;transition:background-color .18s var(--ease),transform .14s var(--ease)}.cb:active{transform:scale(.9)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}.cg small{font-size:11px;color:var(--mu);padding-bottom:4px}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px;padding-top:4px;background:none;border:1px solid transparent;border-radius:10px;color:inherit;font:inherit;cursor:pointer;transition:background-color .16s var(--ease),border-color .18s var(--ease),transform .14s var(--ease)}
.cd:active{transform:scale(.93)}.cd.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.cd b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:600;transition:transform .18s var(--spring)}.cd.td b{background:var(--ac);color:var(--on)}
.cd em{display:flex;gap:3px;min-height:8px}.cd i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c)}.cd i.f{background:var(--c)}
.cal2 .sub{margin-top:10px}.cb:focus-visible,.cd:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.day-detail{margin-top:12px;padding:12px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);font-size:13px}
.day-detail h4{margin:0 0 6px;font-size:13px;color:var(--ac)}
.day-detail ul{margin:0;padding-left:16px;color:var(--detail-tx)}

.run-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.run-grid label{font-size:11px;color:var(--mu);display:block}
.run-grid input{width:100%;height:38px;margin-top:4px;padding:0 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:500 14px Archivo,sans-serif;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.run-grid input:focus{outline:2px solid var(--ac);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent)}

/* Clock Modal & Floating Pill */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.58);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fadeIn .18s var(--ease) both}
.modal-bg.closing{animation:fadeOut .15s var(--ease) both;pointer-events:none}
.modal-card{width:100%;max-width:340px;padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--bd);box-shadow:0 20px 50px rgba(0,0,0,.45);animation:modalIn .24s var(--ease) both}
.modal-bg.closing .modal-card{animation:modalOut .15s var(--ease) both}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-hd h3{margin:0;font-size:17px;font-weight:700}
.modal-x{width:32px;height:32px;border-radius:50%;border:0;background:var(--s2);color:var(--mu);font-size:15px;cursor:pointer;display:grid;place-items:center;transition:background-color .16s var(--ease),color .16s var(--ease),transform .14s var(--ease)}.modal-x:active{transform:scale(.9)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--s2);margin-bottom:16px}
.seg button{height:34px;border:0;border-radius:9px;background:none;color:var(--mu);font:600 13px Archivo,sans-serif;cursor:pointer;transition:color .16s var(--ease),background-color .18s var(--ease)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.2)}

   beep();
  }else{

  }

function startManualTimer(sec){

function startStopwatch(){
 clearInterval(clk.iv);
 clk={mode:'sw',running:true,endAt:0,remMs:0,startAt:Date.now(),elapsedMs:0,iv:null};

function toggleClockRun(){
 if(!clk.mode)return;
 if(clk.running){
  clearInterval(clk.iv);clk.iv=null;clk.running=false;
  if(clk.mode==='timer')clk.remMs=Math.max(0,clk.endAt-Date.now());
  else clk.elapsedMs=Date.now()-clk.startAt;
 }else{
  if(clk.mode==='timer'){
   if(clk.remMs<=0)return;
   clk.endAt=Date.now()+clk.remMs;
  }else{
   clk.startAt=Date.now()-clk.elapsedMs;
  }
  clk.running=true;
  clk.iv=setInterval(tickClock,200);
 }
 renderPill();
}
function adjustManualTimer(deltaSec){
 if(clk.mode!=='timer')return;
 if(clk.running){
  clk.endAt=Math.max(Date.now()+1000,clk.endAt+deltaSec*1000);
  clk.remMs=clk.endAt-Date.now();
 }else{
  clk.remMs=Math.max(0,clk.remMs+deltaSec*1000);
 }
 renderPill();
}
function resetStopwatch(){

}

function model(){const P=progs(),p=P.find(x=>x.id==S.prog)||P[0],core=parseCSV(S.core?S.core.csv:CSV.core),dn=S.done[p.id]||{},wt=S.weights[p.id]||{},pwt=S.prevWeights[p.id]||{},rn=(S.runs[p.id]||{});let placed=0,T=0,D=0,vol=0;

   g.push({title:(core[0]&&core[0].Workout)||'Core',rows:core,core:1})}
  else g.push({title:d.w,rows:p.rows.filter(r=>norm(r.Workout)==norm(d.w))});
  let total=0,done=0,count=0;
  const groups=g.filter(x=>x.rows.length).map((x,gi)=>{x.ex=x.rows.map((r,i)=>{
   const sets=Math.max(1,parseInt(r.Sets)||1),key=d.n+'.'+gi+'.'+i+'.'+r.Exercise,arr=dn[key]||[],wArr=wt[key]||[],pwArr=pwt[key]||[];
   let c=0,hasPR=false;
   for(let j=0;j<sets;j++){
    if(arr[j]){c++;const entry=wArr[j]||{};const wVal=parseFloat(entry.w)||0,rVal=parseInt(entry.r)||(parseInt(r.Reps)||0);if(wVal>0&&rVal>0)vol+=wVal*rVal;if(wVal>0&&(S.best1rm[r.Exercise]||0)>0&&calc1RM(wVal,rVal)>=(S.best1rm[r.Exercise]||0))hasPR=true}

function calcStreak(){const log=S.log||{};const dates=Object.keys(log).sort();if(!dates.length)return 0;

 const o2=OPEN2.has(e.key),link=/^https?:\/\//i.test(u)?`<a class="tut" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('play')}Watch Tutorial ↗</a>`:'<span class="sub">No tutorial listed</span>';
 const detailsHtml=o2?`<div class="${animMore===e.key?'anim-unfold':''}"><dl class="meta">${fld('Target muscle',f['Target Muscle'],'target',1)}${fld('Reps to failure',f['Reps to Failure'],'flame')}${fld('Rest',f.Rest,'clock')}</dl><div class="tut-row">${link}</div></div>`:'';
 const body=open?`<div class="eb${animEx===e.key?' anim-unfold':''}">${f['Form Notes']?`<p class="notes">${esc(f['Form Notes'])}</p>`:''}<div class="sets">${sets}</div><button class="more" data-more="${esc(e.key)}" aria-expanded="${o2}">${o2?'Hide details':'More details'}${ic('next')}</button>${detailsHtml}</div>`:'';
 const prTag=e.hasPR?`<span class="pr-badge">PR</span>`:'';
 const justDone=full&&animChk&&animChk.startsWith(e.key+':');
 return `<article class="ex${full?' done':''}${open?' open':''}"><button class="eh" data-ex="${esc(e.key)}" aria-expanded="${open}"><span class="no${justDone?' no-pop':''}">${full?ic('check'):num}</span><span class="en">${esc(f.Exercise)||'Untitled exercise'}${prTag}</span><span class="rs"><b>${esc(f.Sets)||n} × ${esc(f.Reps)||'—'}</b><span>${c}/${n} completed</span></span><span class="chev">${ic('next')}</span></button>${body}</article>`}

function wk(m){const d=m.days.find(x=>x.n==S.day)||m.days[0],r0=d.groups&&d.groups[0]&&d.groups[0].rows[0];
 const strip=m.days.map(x=>`<button class="dy${x.n==d.n?' on':''}${x.total&&x.done==x.total?' full':''}" style="--c:${DC[x.n-1]}" data-day="${x.n}" aria-label="Day ${x.n}">Day<span>${x.n}</span></button>`).join('');
 const sub=d.rest||d.run?'Day '+d.n:r0?esc(r0.Block)+', listed as '+esc(r0.Day)+' in the CSV':'No exercises for this workout in the CSV';
 let h=`<div style="--ac:${DC[d.n-1]}"><div class="bar0"><a class="back" href="#dashboard">${ic('back')}Dashboard</a><div class="bar0-r">${clockBtnHtml()}${themeBtnHtml()}</div></div><h1 class="ttl">${esc(d.w)}</h1><p class="sub">${sub}</p>
<div class="cal"><div class="strip">${strip}</div>${d.rest?'':`<p class="pt">${d.done}/${d.total} sets completed (${pc(d.done,d.total)}%)</p><span class="bar"><i style="width:${pc(d.done,d.total)}%"></i></span>`}</div>`;
 if(d.rest)return h+'<p class="sub">No training scheduled.</p></div>';
 if(d.run){const rm=d.runMeta||{};const runKey='run'+d.n;const runPop=animChk===runKey+':0';
  h+=`<article class="ex${d.runOn?' done':''}"><div class="eh static"><span class="no${d.runOn&&runPop?' no-pop':''}">${d.runOn?ic('check'):ic('pulse')}</span><span class="en">${esc(d.run)}</span></div><div class="eb"><div class="sets" style="margin:0"><label class="set${d.runOn?' on':''}"><span class="set-lbl"><b>Run completed</b><small>Log optional distance &amp; duration below</small></span><input type="checkbox"${runPop?' class="chk-pop"':''} data-k="${runKey}" data-i="0"${d.runOn?' checked':''}></label></div><div class="run-grid"><label>Distance<input type="text" placeholder="e.g. 5 km" data-rk="${runKey}" data-rf="dist" value="${esc(rm.dist||'')}"></label><label>Duration / Intervals<input type="text" placeholder="e.g. 28:30 or 8×400m" data-rk="${runKey}" data-rf="time" value="${esc(rm.time||'')}"></label></div></div></article>`}
 d.groups.forEach(g=>{if(d.run){const r=g.rows[0];h+=`<h2 class="sec">${esc(g.title)}</h2><p class="sub">${esc(r.Block)}, ${esc(r.Day)}</p>`}h+=g.ex.map((e,i)=>exCard(e,i+1)).join('')});
 return h+'</div>'}

function loginHtml(){return `<div class="lg"><div class="bar0" style="margin-bottom:12px"><span class="brand">Gym Tracker</span><div class="bar0-r">${themeBtnHtml()}</div></div><h1 class="ttl">Log in</h1><p class="sub">Use the username and password you were given.</p>
<div class="lf"><input id="lu" class="pi" type="text" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(loginU)}">
<div class="prow"><input id="lp" class="pi" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password"><button class="eye" data-act="peek" aria-label="Show password">${ic('eye')}</button></div></div>
${loginErr?`<p class="err${animErr?' anim-err':''}">${esc(loginErr)}</p>`:''}<button class="btn pri" data-act="login">Log in</button></div>`}

function setGlow(a){const s=document.documentElement.style;a.forEach((c,i)=>s.setProperty('--g'+(i+1),c))}
function syncAccent(){
 const root=document.documentElement.style;
 if(USER&&location.hash=='#workout'){
  const dc=DC[(+S.day||1)-1];
  root.setProperty('--ac',dc);
 }else{
  root.removeProperty('--ac');
 }
}
function render(){
 syncWakeLock();syncAccent();
 const routeKey=USER?(location.hash=='#workout'?'wk:'+S.day:'dash'):'login';
 const isNewView=routeKey!==lastRouteKey;
 const prevWkBar=!isNewView&&routeKey.startsWith('wk:')?$('#app .cal .bar i')?.style.width:null;
 lastRouteKey=routeKey;

 if(!USER){
  setGlow([DC[0],DC[1],DC[4],DC[2]]);
  $('#app').innerHTML=`<div class="${isNewView?'anim-view':''}">${loginHtml()}</div>`;
  animErr=false;
  return;
 }
 const m=model(),y=scrollY,dc=DC[(+S.day||1)-1];
 setGlow(location.hash=='#workout'?[dc,dc,dc,dc]:[DC[0],DC[1],DC[4],DC[2]]);
 const content=location.hash=='#workout'?wk(m):dash(m);
 $('#app').innerHTML=`<div class="${isNewView?'anim-view':''}">${content}</div>`;

 // Smoothly animate workout progress bar width on set toggles
 if(prevWkBar!==null&&prevWkBar!==undefined){
  const newBar=$('#app .cal .bar i');
  if(newBar&&newBar.style.width!==prevWkBar){
   const targetW=newBar.style.width;
   newBar.style.width=prevWkBar;
   newBar.getBoundingClientRect();
   newBar.style.width=targetW;
  }
 }

 animEx=null;animMore=null;animChk=null;animDate=null;animCal=0;animAsk=false;animNote=false;animErr=false;
 scrollTo(0,y);
}

document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('opt'))optOpen=e.target.open},true);
document.addEventListener('click',e=>{
 // Clock modal & pill interactions
 const tabBtn=e.target.closest('[data-ctab]');if(tabBtn){if(clockTab!==tabBtn.dataset.ctab){clockTab=tabBtn.dataset.ctab;renderModal(true)}return}
 const preBtn=e.target.closest('[data-preset]');if(preBtn){startManualTimer(+preBtn.dataset.preset);return}
 const cact=e.target.closest('[data-cact]');if(cact){
  const act=cact.dataset.cact;
  if(act==='modal-bg'&&e.target!==cact)return;
  if(act==='close-modal'||act==='modal-bg'){closeClockModal();return}
  if(act==='start-custom-timer'){
   const m=Math.max(0,parseInt($('#c-min')?.value)||0),s=Math.max(0,parseInt($('#c-sec')?.value)||0);
   customMin=m;customSec=s;
   const total=m*60+s;
   if(total>0)startManualTimer(total);
   return;
  }
  if(act==='start-sw'){startStopwatch();return}
  if(act==='toggle'){toggleClockRun();return}
  if(act==='t-sub'){adjustManualTimer(-15);return}
  if(act==='t-add'){adjustManualTimer(15);return}
  if(act==='sw-reset'){resetStopwatch();return}
  if(act==='close'){closeClockPill();return}
 }

 const cb=e.target.closest('[data-copy]');if(cb){
  const k=cb.dataset.copy,n=+cb.dataset.sets||1,p=model().p.id;
  const W=S.weights[p]=S.weights[p]||{},arr=W[k]=W[k]||[],first=arr[0]||{};
  for(let i=1;i<n;i++){arr[i]={w:first.w||'',r:first.r||''}}
  save();render();return
 }
 const uBtn=e.target.closest('[data-setunit]');if(uBtn){S.unit=uBtn.dataset.setunit;save();render();return}
 const pOpt=e.target.closest('[data-setprog]');if(pOpt){S.prog=pOpt.dataset.setprog;note='';save();render();return}
 const b=e.target.closest('[data-day],[data-act],[data-ex],[data-more],[data-cdate]');if(!b)return;
 if(b.dataset.act=='open-clock'){clockModal=true;renderModal(false);return}
 if(b.dataset.act=='theme'){applyTheme(THEME==='dark'?'light':'dark',true);render();return}
 if(b.dataset.act=='peek'){const p=$('#lp'),s=p.type=='password';p.type=s?'text':'password';b.innerHTML=ic(s?'eyeoff':'eye');b.setAttribute('aria-label',s?'Hide password':'Show password');return}
 if(b.dataset.cdate!=null){selDate=selDate==b.dataset.cdate?null:b.dataset.cdate;animDate=selDate;render();return}
 if(b.dataset.more!=null){const k=b.dataset.more;if(OPEN2.has(k))OPEN2.delete(k);else{OPEN2.add(k);animMore=k}render();return}
 if(b.dataset.ex!=null){const k=b.dataset.ex;if(OPEN.has(k))OPEN.delete(k);else{OPEN.add(k);animEx=k}render();return}
 if(b.dataset.day){S.day=+b.dataset.day;save();if(location.hash=='#workout')render();else{location.hash='workout'}return}
 const a=b.dataset.act;
 if(a=='ask'){ask=true;animAsk=true}else if(a=='cancel')ask=false;else if(a=='calprev'){if(--calM<0){calM=11;calY--}animCal=-1}else if(a=='calnext'){if(++calM>11){calM=0;calY++}animCal=1}
 else if(a=='login'){loginU=$('#lu').value.trim();const p=$('#lp').value,u=loginU.toLowerCase();if(u&&USERS[u]!==undefined&&USERS[u]===p){enter(u);loginErr='';loginU='';note='';ask=false}else{loginErr='Wrong username or password.';animErr=true}}
 else if(a=='logout'){save();USER=null;try{localStorage.removeItem(SESS)}catch(e){}ckSet('gt_session','',0);note='';ask=false}
 else if(a=='reset'){const pid=model().p.id;S.prevWeights[pid]=JSON.parse(JSON.stringify(S.weights[pid]||{}));S.done[pid]={};ask=false;note='New week started — previous weights saved as targets.';animNote=true}
 else if(a=='rmprog'){delete S.custom;S.prog='w14';note='Uploaded programme removed.';animNote=true}
 else if(a=='rmcore'){delete S.core;note='Using the built-in core workout.';animNote=true}
 else if(a=='expjson'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`gym-tracker-backup-${ymd(new Date())}.json`;a.click();URL.revokeObjectURL(u);note='Backup exported.';animNote=true}
 else if(a=='expcsv'){const rows=[['Date','Workout','Summary']];Object.entries(S.hist||{}).sort().forEach(([dt,days])=>Object.values(days).forEach(d=>rows.push([dt,d.w,d.items.join(' | ')])));const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`gym-logs-${ymd(new Date())}.csv`;a.click();URL.revokeObjectURL(u);note='CSV log exported.';animNote=true}
 save();render()});

document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.wk){const p=model().p.id,W=S.weights[p]=S.weights[p]||{},arr=W[t.dataset.wk]=W[t.dataset.wk]||[],idx=+t.dataset.wi;arr[idx]=arr[idx]||{};arr[idx][t.dataset.wf]=t.value;save()}
 else if(t.dataset.rk){const p=model().p.id,R=S.runs[p]=S.runs[p]||{},obj=R[t.dataset.rk]=R[t.dataset.rk]||{};obj[t.dataset.rf]=t.value;save()}});

document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.k){
  const p=model().p.id,d=S.done[p]=S.done[p]||{},a=d[t.dataset.k]=d[t.dataset.k]||[],idx=+t.dataset.i;
  a[idx]=t.checked;
  if(t.checked){
   animChk=t.dataset.k+':'+idx;
   const wEntry=((S.weights[p]||{})[t.dataset.k]||[])[idx]||{};
   if(t.dataset.exname&&wEntry.w)checkPR(t.dataset.exname,wEntry.w,wEntry.r||1);
  }
  logDay(t.dataset.k);save();render()
 }
 else if(t.id=='prog'){S.prog=t.value;note='';save();render()}
 else if(t.id=='unit'){S.unit=t.value;save();render()}
 else if(t.id=='impjson'){const f=t.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data&&typeof data=='object'&&data.done){S=Object.assign(DEF(),data);note='Backup restored successfully.';animNote=true}else{note='Invalid backup file.';animNote=true}}catch(x){note='Could not read backup file.';animNote=true}t.value='';save();render()}
 else if(t.id=='upp'||t.id=='upc'){const f=t.files[0];if(!f)return;let ok=false,rows=[],txt='';
  try{txt=await f.text();rows=parseCSV(txt);ok=rows.length&&['Exercise','Sets','Workout'].every(k=>k in rows[0])}catch(x){}
  if(ok){if(t.id=='upp'){S.custom={name:f.name,csv:txt};S.prog='custom'}else S.core={name:f.name,csv:txt};note=`Loaded ${rows.length} exercises from ${f.name}.`}
  else note=`${f.name} couldn’t be loaded. The CSV needs at least Workout, Exercise and Sets columns.`;
  animNote=true;t.value='';save();render()}});

document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='lu'||e.target.id=='lp'))$('[data-act=login]').click()});
addEventListener('hashchange',()=>{note='';ask=false;render();scrollTo(0,0)});
render();

const EMB=CSV.logins;
async function getTxt(names){let err='not found';for(const n of names){try{const r=await fetch(n,{cache:'no-store'});if(!r.ok){err='HTTP '+r.status;continue}const x=await r.text();if(x.trim()&&!/^\s*</.test(x))return{x,n};err='unexpected content'}catch(e){err='could not be fetched'}}return{err}}
if(LIVE)(async()=>{
 const L=await getTxt(['logins.txt','logins.txt.txt','Logins.txt','login.txt']);
 if(L.x){CSV.logins=L.x;buildUsers();if(!Object.keys(USERS).length){CSV.logins=EMB;buildUsers()}}
 const u=$('#lu');if(u)loginU=u.value;render();
 for(const f of [['w14','weeks-1-4.csv'],['w58','weeks-5-8.csv'],['core','core-workout.csv']]){const r=await getTxt([f[1]]);if(r.x)CSV[f[0]]=r.x}
 if(USER)render()})();
</script></body></html>
