        <div class="contact-container">
            <h1>CONTACT US</h1>
            <p>Have a question about a property? Reach out to us below.</p>
            
            <form id="contactForm">
                <div class="input-group">
                    <input type="text" id="name" name="user_name" placeholder="YOUR NAME" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="user_email" placeholder="YOUR EMAIL" required>
                </div>
                <div class="input-group">
                    <textarea id="message" name="user_message" rows="5" placeholder="YOUR MESSAGE" required></textarea>
                </div>
                <button type="submit" class="view-btn">SUBMIT</button>
            </form>
            <div id="responseMessage" class="response-msg"></div>
        </div>
    </div>
